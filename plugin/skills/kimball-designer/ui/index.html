cription:"",scdType:null}],hierarchies:[]}],zS=[{id:"as_adjudicated",text:"Only finally adjudicated claim lines are loaded; adjustments arrive as reversing lines."}],qS=[{id:"oq_phi",text:"Which roles may see member-level detail versus de-identified aggregates?",owner:"Dr. Amara Nwosu",status:"open"}],US={$schema:AS,schemaVersion:CS,meta:DS,stakeholders:OS,requirements:MS,processes:RS,dimensions:$S,assumptions:zS,openQuestions:qS},_v=[{id:"retail",title:"Retail sales & inventory",description:"Store sales, daily inventory, vendor receipts and online fulfilment."},{id:"saas",title:"SaaS subscriptions",description:"Subscription changes, MRR snapshots, invoicing, product usage and support."},{id:"healthcare",title:"Healthcare claims",description:"Medical and pharmacy claims, member eligibility and prior authorisations."}],BS={retail:bS,saas:kS,healthcare:US};function Tv(s,r){const u=pc(JSON.parse(JSON.stringify(BS[s])),r);return r?{...u,meta:{...u.meta,createdAt:r,updatedAt:r}}:u}const HS={kickoff:{why:"A dimensional model is only as useful as the business problem it serves. Agreeing on purpose, sponsor and scope up front keeps the interviews focused and stops the model from growing in every direction.",ask:["What business decisions should this warehouse improve?","Who is the sponsor, and how will they judge success in six months?","Which business areas are in scope for the first release — and which are explicitly not?","Are there deadlines, regulatory drivers or known pain points?"],tips:['Write the purpose as a business outcome ("reduce out-of-stocks"), not a technology ("build a lakehouse").',"Keep success criteria measurable and few — two or three is plenty.","Recording what is out of scope is as valuable as what is in scope."],pitfalls:["Starting from the source systems instead of the business questions.","A scope so broad that every department expects something in release one."],examples:['Purpose: "Give merchandising one trusted view of sales and margin by category, store and week."']},stakeholders:{why:"Kimball requirements come from interviews with the people who make decisions and the people who know the data. A balanced list — executives, managers, analysts and source-system owners — prevents both wishful thinking and technical tunnel vision.",ask:["Who makes decisions that this data should support?","Who builds reports and analyses today, and where does it hurt?","Who owns and understands each source system?","Whose sign-off will the model need?"],tips:["Interview in small groups by role; one facilitator, one note-taker.","Send a short agenda in advance; ask about decisions and measures, not about tables.","Mark interviews done as you go — the notes are the raw material for requirements."],pitfalls:["Only talking to IT, or only talking to executives.",'Asking "what data do you want?" — you will get a list of every field in the source system.'],examples:["VP Merchandising (executive), Category manager (business), BI analyst (analyst), POS platform lead (IT)."]},requirements:{why:"Requirements are the business questions people need answered and the measures they use to judge performance. They are what you will trace every business process and fact back to.",ask:["What are the top questions you cannot answer today?","How do you measure success in your area? Which KPIs do you report?","How do you want to slice those numbers — by what, and at what level of detail?","What would you do differently if you had this information?"],tips:["Record requirements in the stakeholder's own words; one question per requirement.","Capture KPIs separately — they often reveal the facts you will need.","Use MoSCoW priority so the first release is small and valuable.","Write down assumptions and open questions instead of guessing."],pitfalls:['Writing report specifications ("a monthly PDF with 12 columns") instead of questions.',"Silently filling gaps — anything uncertain belongs in open questions."],examples:['"Did a promotion increase sales, and did it cannibalise other products?" — KPIs: promotion lift, incremental margin.']},processes:{why:"Step 1 of the four-step design: select the business process. A business process is an operational event that produces measurements — taking an order, shipping, paying a claim. Each one becomes (at least) one fact table and one row of the bus matrix.",ask:["Which business events produce the numbers behind each requirement?","Which source system captures that event, and who owns it?","Is the data available at the most detailed level?","How valuable is this process to the business, and how feasible is it to deliver?"],tips:['Name processes as events or activities ("Retail sales", "Claims submitted"), not departments or reports.',"Link each requirement to the processes that answer it — unlinked requirements expose missing processes.","Score business value and feasibility 1–5; build the high-high processes first."],pitfalls:['Modelling a department ("Marketing") instead of its processes ("Campaign responses", "Email sends").',"Merging two events with different grains into one process."],examples:["Retail: Retail sales · Store inventory · Purchase order receipts · Online order fulfilment."]},grain:{why:"Step 2: declare the grain — exactly what one row in the fact table represents. It is the most important design decision. Declare it in business terms before choosing dimensions or facts, and prefer the most atomic grain the source can provide.",ask:["What is the most detailed level at which this event is captured?","What exactly is one row? An order, an order line, a daily balance?","Does each row represent an event (transaction), a period (snapshot) or the lifetime of something (accumulating snapshot)?"],tips:['Use the form "One row per …".',"Atomic grain answers questions nobody has asked yet; summaries can always be built from it.","If two measures have different grains, they belong in different fact tables."],pitfalls:['Choosing a summarised grain to "save space" and losing the ability to drill down.',"Mixing grains in one fact table (for example order headers and order lines)."],examples:['Transaction: "One row per product scanned on a sales transaction line."','Periodic snapshot: "One row per product per store per day."','Accumulating snapshot: "One row per order line, updated at each fulfilment milestone."']},dimensions:{why:"Step 3: identify the dimensions — the who, what, where, when, why and how that describe each row at the declared grain. Dimensions that mean the same thing across processes must be conformed (shared), because that is what lets you compare and drill across processes.",ask:["At this grain, who is involved? What is being measured? Where? When? Why? How?","Which attributes do people filter, group and label reports by?","Is this the same Customer (Product, Store, …) as in the other processes?","Does a date play several roles (order date, ship date)?"],tips:["Reuse a dimension across processes whenever it means the same thing — that is a conformed dimension.",'Use roles for role-playing dimensions instead of creating "Order date" and "Ship date" dimensions.',"Transaction numbers with no attributes are degenerate dimensions.","Note which attributes need history (SCD type 2)."],pitfalls:["Creating slightly different versions of the same dimension per process.","Putting descriptive text in the fact table instead of a dimension.","Forgetting the date dimension."],examples:["Retail sales: Date, Product, Store, Promotion, Customer, Employee (as Cashier), Payment method, POS transaction number."]},facts:{why:"Step 4: identify the facts — the numeric measurements produced by the event at the declared grain. Knowing whether a fact is additive, semi-additive or non-additive tells report builders how it can be aggregated.",ask:["What numbers does this event produce at the declared grain?","Which KPIs from the requirements are built from these numbers?","Can this number be summed across all dimensions? Across time?"],tips:["Prefer additive facts; store the additive parts of ratios (numerator and denominator).","Balances and levels are semi-additive — do not sum them over time.","A process with no numeric measures can still be useful as a factless fact table."],pitfalls:["Storing percentages or unit prices and then summing them.","Adding facts that belong to a different grain."],examples:["Additive: sales amount, quantity. Semi-additive: inventory on hand. Non-additive: unit price, margin %."]},bubbles:{why:"The bubble diagram is Kimball's high-level model: one per business process, with the process in the centre and its dimensions around it. It is the artefact to review with business stakeholders before any detailed design.",ask:["Looking at this diagram, can you answer your questions by combining these dimensions?","Is anything missing that you would want to filter or group by?","Does the grain match how you think about this process?"],tips:["Walk stakeholders through one diagram at a time.","Amber bubbles are conformed — point out how they connect processes.","Export SVG or PNG for slides and documents."],pitfalls:["Reviewing table designs with business users — the bubble diagram is the right level."],examples:[]},matrix:{why:"The enterprise bus matrix lists business processes as rows and dimensions as columns. It is the architecture plan for an integrated warehouse: conformed columns are built once and reused, and each row can be delivered incrementally.",ask:["Which dimensions are shared by most processes? Who owns their definition?","Is there a column used by only one process that should really be shared?","In which order should the rows be delivered?"],tips:["Columns used by many rows are your most valuable conformed dimensions — agree their definitions first.","Sort rows by priority to plan iterations.","Keep the matrix on the wall (or in the README) — it is a communication tool."],pitfalls:["Columns that are near-duplicates (Customer vs Client) — conform them.","Treating the matrix as finished; it grows with every new process."],examples:[]},review:{why:"Before handing over, resolve errors and warnings, check open questions with their owners, and export the deliverables for review with the sponsor.",ask:["Are all must-have requirements linked to a modelled process?","Which open questions block the first iteration?","Who signs off the bus matrix and the first bubble diagrams?"],tips:["Errors must be fixed; warnings usually should be; notes are judgement calls.","Share requirements.md plus the bubble diagrams with stakeholders.","Ask Claude to render the deliverables and draft the next step (detailed dimension design)."],pitfalls:['Skipping the sponsor review because the diagrams "look right".'],examples:[]},prototype:{why:"A design is easier to judge with rows in it. The prototype turns each dimension and business process into a table, fills them with made-up data and lets you ask the questions from your requirements. You see whether the grain, the dimensions and the facts really answer them before anyone writes a load job, and you get a CREATE TABLE script and index advice to start the build.",ask:["Can we answer each must-have requirement with one of these queries?","Which attribute is the business key of each dimension in the source system?","Roughly how many rows will each fact table get per day or month?","Which database platform will the warehouse run on?"],tips:["Save the question that answers each requirement. A must-have you can't answer points to a missing dimension, attribute or fact.","Ask Claude to suggest realistic sample values for the attributes, so the data looks like your business.","Group a semi-additive fact (a balance) by date, or average it; the explorer warns when a sum would be wrong.","Download the sandbox bundle and run docker compose up -d to query the same tables with any SQL tool.","Building with dbt? The dbt project has a model per table, the tests and the sample rows as seeds: dbt seed, dbt run and dbt test work against the sandbox.","Treat the script as a starting point: review data types, text lengths and business keys before you build."],pitfalls:["Mistaking sample data for real data: the rows are random, only the structure is yours.","Adding indexes everywhere: fact tables need few (or a columnstore); dimensions need their keys.","Building every table at once instead of the top process on the prioritisation grid first."],examples:['"Net sales amount by product category and month" for a retail sales fact table.']}},LS={executive:["What are the organisation's objectives for the next year? How is success measured?","Which decisions would you make differently with better information?","What are the biggest risks or problems in your area right now?","How do you compare performance today — over time, against plan, against competitors?","What would make this program a success in your eyes?"],business:["Describe your team's responsibilities. What events or activities do you manage?","Which reports do you use today? What do you do with them? What is missing?","How do you measure your team's performance? Which KPIs?","How do you need to slice those numbers — by product, customer, region, time…?","How far back do you need history, and how current must the data be?"],analyst:["Which analyses do you run most often, and how long do they take?","Where does the data come from today, and how much manual work is involved?","Which numbers are disputed or reconciled by hand?","Which questions are you asked that you cannot answer?","Which definitions differ between departments (customer, revenue, active)?"],it:["Which systems capture these business events? At what level of detail?","How reliable is the data? Known quality issues, late or missing records?","How are changes captured — updates in place, history tables, change logs?","Which identifiers link systems together (customer id, product code)?","Are there constraints on access, volume, privacy or load windows?"],other:["How do you use information from this area today?","What questions would you like answered?","Who else should we talk to?"]},Xo="https://github.com/kristinnthor/Kimball-designer",IS=[{id:"overview",title:"Overview"},{id:"deliverables",title:"What you get"},{id:"phases",title:"The eleven phases"},{id:"demos",title:"Demos"},{id:"ways",title:"Ways to use it"},{id:"saving",title:"Saving and privacy"},{id:"glossary",title:"Glossary"},{id:"rules",title:"Validation rules"},{id:"shortcuts",title:"Keyboard shortcuts"},{id:"faq",title:"FAQ"}],_m={intro:["Kimball Designer guides you through the **business-requirements stage of the Kimball method**: the short, disciplined process that comes before anyone designs a table. You interview the business, find the business processes that produce the numbers, declare their grain, and agree which dimensions they share.","It works in your browser, inside Claude as a skill, or both at once, and ends with the two pictures every Kimball project needs: a **bubble diagram** per business process and the **enterprise bus matrix**. A last, optional step turns the design into tables with sample data to explore, a CREATE TABLE script with index advice, and a Docker sandbox."],audience:["**Data and BI engineers** starting a new warehouse, lakehouse or data mart.","**Analytics engineers** who want a model the business has agreed to before writing dbt models.","**Data architects** planning conformed dimensions across teams.","**Business analysts and product owners** running requirements workshops."],howItFlows:"The work is split into eleven short phases in four stages. **Discover** captures the business context, **Model** applies Kimball’s four-step design (process, grain, dimensions, facts), **Deliver** turns it into diagrams, a matrix and documents, and **Build** lets you try the design on sample data and get the SQL to build it. The coach panel explains each phase as you go, and the stepper shows how far you are."},YS="After the first ten phases you have an agreed, documented high-level dimensional design: the blueprint the Kimball method asks for before anyone builds a table. The Prototype phase then gives you a first physical version of it to try out.",GS=[{title:"A shared language",text:"Business and IT agree on the names of the business processes, what one row means, and which dimensions describe them. Most warehouse rework comes from getting these wrong."},{title:"A scoped, prioritised first release",text:"Each process is scored on business value and feasibility, so the first thing you build is the one that pays off soonest, not the loudest request."},{title:"An architecture that grows without rework",text:"The bus matrix shows which dimensions are shared. Build each conformed dimension once and every new process plugs into it, so reports can drill across processes."},{title:"Traceability",text:"Every business question is linked to the process that answers it and to the stakeholder who asked. Nothing gets built that nobody needs, and nothing needed is forgotten."},{title:"Honest unknowns",text:"Assumptions and open questions are recorded with owners instead of guessed. Kimball Designer, and Claude with the skill, never invent business facts."},{title:"A head start on the build",text:"Grain, fact table type, facts with additivity, dimensions with roles and SCD hints are exactly the inputs the detailed design and ETL work start from."}],QS=[{id:"bubbles",title:"Bubble diagrams",formats:"SVG, PNG, Mermaid · `bubbles/<process>.svg`, `.mmd`",summary:"One picture per business process: the process (the future fact table) in the middle, the dimensions that describe it around it, and the grain underneath.",contains:["The business process and its fact table type.","Every dimension it uses, with role names (for example *Order date* and *Ship date* for one Date dimension).","Conformed dimensions highlighted in amber, so shared pieces stand out.","The grain statement: what one row represents."],usedBy:'Business stakeholders, to confirm "yes, this is how we think about orders". Modellers, as the starting point for the detailed design.',why:"It is the simplest model a non-technical person can check. Mistakes caught here cost minutes; caught after the build, they cost weeks.",where:"Phase 8 *Bubble diagrams*, `kimball render`, and inside the requirements document as Mermaid.",image:{src:"images/ui-bubble-diagrams.jpg",alt:"Bubble diagram for a business process, with conformed dimensions in amber"}},{id:"matrix",title:"Enterprise bus matrix",formats:"Markdown, CSV, HTML · `bus-matrix.md`, `.csv`, `.html`",summary:"Business processes as rows, dimensions as columns, and a mark wherever a process uses a dimension.",contains:["Every business process with its grain.","Every dimension, most-shared first; conformed columns highlighted.","Role names in the cells where a dimension plays several roles.","Optional ordering by priority, so the matrix doubles as a delivery plan."],usedBy:"Architects and data engineers, to plan which dimensions to build once and share. Programme managers, to plan releases one row at a time.",why:"It is the architecture of the whole warehouse on one page. Columns with many marks are the conformed dimensions that make cross-process reporting possible.",where:"Phase 9 *Bus matrix*, `kimball render`, and section 6 of the requirements document.",image:{src:"images/ui-bus-matrix.jpg",alt:"Interactive bus matrix with conformed dimension columns"}},{id:"requirements",title:"Requirements document",formats:"Markdown · `requirements.md`",summary:"The written record of everything agreed, ready for sign-off or a pull request.",contains:["Overview: purpose, sponsor, scope in and out, success criteria.","Stakeholders and interview status.","Business requirements with priority, KPIs, who raised them, which processes answer them and, once you use the prototype, the query that answers each one.","Each business process with grain, fact table type, dimensions, facts and its bubble diagram.","The dimension catalogue with kinds, key attributes, hierarchies and where each is used.","The bus matrix, the prioritisation, assumptions and open questions."],usedBy:"The sponsor, to sign off. The whole team, as the reference during the build.",why:"Decisions made in workshops fade quickly. A document that traces every requirement to a process keeps the team honest.",where:"Phase 10 *Review & export* and `kimball render`."},{id:"priority",title:"Prioritisation grid",formats:"In the UI and the requirements document",summary:"Each business process plotted by business value against feasibility, both scored 1 to 5.",contains:["Four quadrants: *Build first*, *Valuable but hard*, *Easy, lower value* and *Later*.","The score (value × feasibility) for each process."],usedBy:"The sponsor and the delivery lead, to choose the first release.",why:"Kimball recommends delivering one business process at a time. The grid makes that choice explicit and defensible.",where:"Phase 4 *Business processes* and section 7 of the requirements document."},{id:"review",title:"Validation report",formats:"In the UI, `kimball validate` (text or `--json`)",summary:"The model checked against 18 Kimball best-practice rules, each with a hint on how to fix it.",contains:["Errors (broken references, missing names), warnings (no grain, no date dimension, unused dimensions) and notes.","A link from each finding to the phase where you fix it."],usedBy:"Whoever runs the process, before sharing anything.",why:"It catches the classic mistakes early: processes without a grain, facts without dimensions, dimensions nobody shares.",where:"Phase 10 *Review & export*, the coach panel checklist, and `kimball validate`."},{id:"questions",title:"Assumptions and open questions",formats:"In the UI and the requirements document",summary:"What you assumed and what you still need to find out, each question with an owner.",contains:['Assumptions such as "the fiscal calendar is 4-4-5".',"Open and answered questions with owners."],usedBy:"The team, as a to-do list before the detailed design.",why:"Unknowns written down get answered. Unknowns left in someone’s head become wrong assumptions in production.",where:"Phase 3 *Requirements* and the requirements document."},{id:"project",title:"Project file",formats:"JSON · `<project>.kimball.json`",summary:"The single source of truth behind every deliverable above, described by a JSON Schema.",contains:["Everything you entered: scope, stakeholders, requirements, processes, dimensions, facts, assumptions and questions."],usedBy:"You, to save and share work. Git, to version it. Claude and the `kimball` CLI, to read and update it.",why:"Diagrams and matrices are always regenerated from this file, so they can never disagree with each other.",where:"Project menu → *Export project file*, or the file `kimball serve` keeps in sync."},{id:"prototype",title:"Prototype: sample data, SQL and a sandbox",formats:"In the UI · `schema.sql`, `index-recommendations.md`, `docker-compose.yml`, CSV, a dbt project · `kimball prototype`, `kimball ddl`",summary:"Your design as a star schema filled with made-up rows, a CREATE TABLE script with index advice, and a PostgreSQL sandbox for Docker.",contains:["One table per dimension (surrogate key, business key, type 2 history columns) and one per business process (a key per dimension role, the facts).","Sample rows you can group and filter in the browser, with the matching SQL.","The question that answers each requirement, saved with it: the requirements document shows it and `queries.sql` gets its SQL.","CREATE TABLE scripts for PostgreSQL, SQL Server or Snowflake, with keys and indexes, and recommendations for later (columnstore, BRIN, partitioning, clustering).","A Docker Compose sandbox that loads the tables and data on first start.","A dbt project: a model per table with descriptions and tests (unique and not-null keys, every fact key found in its dimension), with the sample rows as seeds so it runs against the sandbox as it is."],usedBy:"Data engineers starting the build, and the business users who want to see how their questions will be answered.",why:"Problems with the grain or missing dimensions show up in minutes with rows in front of you, instead of after the first load job.",where:"Phase 11 *Prototype*, or `kimball prototype` and `kimball ddl` from the CLI. Claude can suggest realistic sample values for your attributes.",image:{src:"images/ui-prototype.jpg",alt:"The Prototype phase: net sales grouped by product category over sample data, with the SQL"}},{id:"handoff",title:"Claude hand-off summary",formats:"Plain text",summary:"A compact progress summary you can paste into Claude to continue the work there.",contains:["Progress per phase, open findings and what to do next."],usedBy:"Anyone moving between the browser and Claude.",why:"Claude picks up exactly where you left off, without re-explaining the project.",where:"Phase 10 *Review & export* → *Copy summary*, or `kimball summary`."}],VS=["Build the conformed dimensions first: the columns with the most marks in the bus matrix.","Pick the top process on the prioritisation grid and do its detailed design: every attribute, slowly changing dimension strategy and source-to-target mapping.","Try it in phase 11 *Prototype* first: query the sample data, save the question that answers each must-have requirement, and start from the generated CREATE TABLE script.","Build and release that one process end to end, then the next row of the matrix.","Keep the project file in your repository and update it when scope changes, so the diagrams stay current."],KS="Kimball Designer covers the high-level design and a first physical prototype. It does not produce:",XS=["A finished physical design: the CREATE TABLE script is a starting point to review, not production-ready DDL.","Source-to-target mappings and ETL or ELT code: the dbt project reads sample rows until you connect your own staging models.","Data profiling or connections to your source systems.","Dashboards or reports."],ZS={kickoff:{youDo:"Agree with the sponsor why the warehouse exists and what is in scope.",youRecord:"Name, purpose, sponsor, scope in and out, success criteria.",doneWhen:"Name, purpose and scope are filled in."},stakeholders:{youDo:"List who to interview (executives, managers, analysts, source owners) and hold the interviews.",youRecord:"People, roles, interview status and notes.",doneWhen:"Every interview is done or skipped, and at least one is done."},requirements:{youDo:"Turn interview notes into business questions and KPIs.",youRecord:"Requirements with priority and KPIs, assumptions and open questions.",doneWhen:"At least one requirement is recorded."},processes:{youDo:"Find the business events that produce the numbers, and score them.",youRecord:"Business processes, owners, source systems, value and feasibility, linked requirements.",doneWhen:"At least one business process exists."},grain:{youDo:"Declare exactly what one fact row represents, and the fact table type.",youRecord:'A grain statement ("One row per …") and a type per process.',doneWhen:"Every process has a grain and a fact table type."},dimensions:{youDo:"Ask who, what, where, when, why and how about one row, and reuse dimensions across processes.",youRecord:"The dimension catalogue, attributes, hierarchies, roles and which process uses what.",doneWhen:"Every process has at least one dimension."},facts:{youDo:"List the numeric measurements captured at the grain.",youRecord:"Facts with additivity, unit and description, or *factless*.",doneWhen:"Every process has facts or is marked factless."},bubbles:{youDo:"Review each process as a bubble diagram with its stakeholders.",youRecord:"Nothing new: diagrams are drawn from your model. Click a bubble to edit it.",doneWhen:"Every process has a diagram (at least one dimension)."},matrix:{youDo:"Check the processes against the shared dimensions and fill gaps.",youRecord:"Usage marks, toggled directly in the grid.",doneWhen:"Every dimension is used by a process."},review:{youDo:"Resolve the findings and export the deliverables.",youRecord:"Fixes; then download the files or hand off to Claude.",doneWhen:"There are no errors or warnings."},prototype:{youDo:"Explore the design as tables filled with sample data, save the question that answers each requirement, then download the CREATE TABLE script, index advice and a Docker sandbox.",youRecord:"The query that answers each requirement. Optional: the SQL dialect, sample row counts and dates, and per attribute a data type, business key and sample values.",doneWhen:"Every process has a grain, dimensions and facts, so it can be built as a table."}},$l=s=>s.processes.find(r=>/sale/i.test(r.name))??s.processes[0],jf=[{id:"tour",title:"Tour a finished model",minutes:3,summary:"Walk through a complete retail project, from its purpose to the bus matrix, and see what every phase produces.",setup:{kind:"example",example:"retail"},steps:[{title:"Start with why",phase:"kickoff",body:"Every project starts with a purpose and a scope agreed with the sponsor. This one gives merchandising and store operations one trusted view of sales, inventory, deliveries and online orders."},{title:"Who was interviewed",phase:"stakeholders",body:"Five people: an executive, two business managers, a BI analyst and the owner of the source systems. A balanced list stops both wishful thinking and technical tunnel vision."},{title:"What they need to know",phase:"requirements",body:"Their answers became six business questions with KPIs and priorities. Each one is linked to the business process that will answer it."},{title:"The business processes",phase:"processes",body:"Four business events produce the numbers. Scroll to the prioritisation grid: *Retail sales* scores highest on value and feasibility, so it is built first."},{title:"One row means…",phase:"grain",body:"Each process declares its grain and fact table type. Sales is a *transaction* table, inventory a Quick add**, click **Sales**. Score **Business value** 5 and **Feasibility** 4, and tick your question under **Answers requirements**.",done:s=>{const r=$l(s);return!!r&&r.businessValue!=null&&r.feasibility!=null}},{title:"Declare the grain",phase:"grain",body:"Choose **Transaction** and write the grain *One row per item on a receipt*. Grain first, always: it decides everything that follows.",done:s=>{const r=$l(s);return!!r&&r.grain.trim()!==""&&r.factTableType!=null}},{title:"Pick the dimensions",phase:"dimensions",body:"Quick-add **Date**, **Product** and **Location** (rename it *Shop* if you like). Then tick all three on the Sales card under **Dimensions per business process**.",done:s=>{var r;return(((r=$l(s))==null?void 0:r.dimensions.length)??0)>=3}},{title:"Add the facts",phase:"facts",body:"Click **Add fact** twice: *Quantity* and *Sales amount* (unit *currency*). Both are **Additive**: they can be summed across every dimension.",done:s=>{var r;return(((r=$l(s))==null?void 0:r.facts.length)??0)>=2}},{title:"See your bubble diagram",phase:"bubbles",body:"There it is: Sales in the middle, the dimensions around it and the grain underneath. Download it as SVG or PNG to share.",done:s=>{var r;return(((r=$l(s))==null?void 0:r.dimensions.length)??0)>0}},{title:"Share a dimension",phase:"processes",body:"Quick-add a second process, **Inventory snapshot**. Then, in **Dimensions**, tick Date, Product and Shop for it too. Those dimensions are now **conformed**.",done:s=>s.processes.length>=2&&s.processes.every(r=>r.dimensions.length>0)},{title:"Read the bus matrix",phase:"matrix",body:"Two rows now share the amber columns. That is the bus architecture: build each conformed dimension once, and every process can use it."},{title:"Review and export",phase:"review",body:"The review lists what is still missing, such as the grain and facts for Inventory. Fix what you like, then **Download all (.zip)**. You have just run the whole method in miniature."}]},{id:"share",title:" nts business facts: anything unknown becomes an open question."],code:`/plugin marketplace add kristinnthor/Kimball-designer

ate key",definition:"A meaningless integer that identifies a dimension row. Facts join on it, so history (type 2) and source changes never break the joins."},{term:"Business key",definition:"The identifier the source system uses, such as a customer number or SKU. Kept as a dimension attribute; also called the natural key."},{term:"Slowly changing dimension (SCD)",definition:`How a dimension attribute keeps history when it changes. ${af.map(s=>`${s.label}: ${s.description.replace(/\.$/,"")}`).join(". ")}.`}],e_=[{keys:"Ctrl+Z (⌘Z on Mac)",action:"Undo"},{keys:"Ctrl+Shift+Z or Ctrl+Y",action:"Redo"},{keys:"Arrow keys",action:"Move between cells in the bus matrix"},{keys:"Space or Enter",action:"Toggle the focused bus matrix cell"},{keys:"Tab / Shift+Tab",action:"Move through fields and buttons; every control works without a mouse"}],t_=[{q:"Do I need Claude to use Kimball Designer?",a:"No. The guided UI works on its own, online or from one offline file. Claude adds an interviewer that asks the right questions and writes the files into your repository."},{q:"Does it generate SQL or table designs?",a:"Yes, as a starting point. Phase 11 *Prototype* turns the design into a star schema with a CREATE TABLE script for PostgreSQL, SQL Server or Snowflake, index recommendations, sample data, a Docker sandbox and a dbt project with tests. Review data types and keys in the detailed design before you build for real."},{q:"How long does the process take?",a:"The demo takes ten minutes. A real first business process usually takes a few interviews and one or two modelling workshops; the tool keeps each session focused."},{q:"Can several people work on one project?",a:"Share the `.kimball.json` file, ideally in a Git repository. One person edits at a time; the file is plain JSON, so changes are easy to review."},{q:"Where did my project go?",a:"It is saved in the browser you used. If you cleared site data or switched browsers, open your exported `.kimball.json` file instead."},{q:"Wh ## Start the sandbox

You need Docker (Docker Desktop on Windows and macOS).

\`\`\`bash
docker compose up -d
docker compose exec db psql -U kimball -d kimball
\`\`\`

PostgreSQL loads \`initdb/01-schema.sql\` and \`initdb/02-data.sql\` the first time it starts (${u} tables). Any SQL client works too: host \`127.0.0.1\`, port \`${Vl}\`, database and user \`kimball\`, no password. The port only listens on this computer.

Try the queries in \`queries.sql\`, for example:

\`\`\`bash
docker compose exec -T db psql -U kimball -d kimball < queries.sql
\`\`\`

To start again after changing the design, write a new bundle and run \`docker compose down -v\`, then \`docker compose up -d\`.

## Files

| File | What |
|---|---|
| \`docker-compose.yml\` | PostgreSQL ${kv.split(":")[1]} sandbox |
| \`initdb/01-schema.sql\` | CREATE TABLE script and indexes for PostgreSQL (loaded by the sandbox) |
| \`initdb/02-data.sql\` | The sample rows as INSERT statements |
| \`schema.sql\` | CREATE TABLE script for ${c}, your target platform |
| \`index-recommendations.md\` | Which keys and indexes to create, now and later, and why |
| \`queries.sql\` | The saved queries that answer your requirements, and example star-join queries |
| \`data/*.csv\` | The sample rows as CSV, to load anywhere |
| \`dbt/\` | A dbt project: a model per table with descriptions and tests, the sample rows as seeds; see \`dbt/README.md\` |
